# Builds the web app and publishes it to the live Firebase Hosting channel.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One live deploy at a time; a newer commit supersedes an older one.
concurrency:
  group: hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    secrets: inherit
