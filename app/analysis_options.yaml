include: package:solid_lints/analysis_options.yaml

# Without this block only the stock Dart lints run: the solid_lints rules
# (member_ordering, no_magic_number, cyclomatic_complexity and the rest) are
# an analysis server plugin and have to be enabled explicitly.
plugins:
  solid_lints: ^2.0.0

analyzer:
  exclude:
    # Generated by `flutterfire configure`.
    - "lib/firebase_options.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

solid_lints:
  diagnostics:
    # Catalog item builders are declarative adapters: a `CatalogItem` binds a
    # JSON schema to exactly one widget constructor, so the builder returning
    # a widget is the point of the abstraction rather than a smell. The rule
    # stands everywhere else, which is why there are no `Widget _buildX()`
    # helpers in the UI.
    avoid_returning_widgets: false
    function_lines_of_code:
      max_lines: 120
