<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A patient dashboard composed by AI around each complaint. Demo by Solid Software with fictional patients.">
  <meta name="theme-color" content="#173A7A">

  <!-- Link previews (Slack, Teams, LinkedIn, iMessage, X). Crawlers read
       this file as-is and never run the app, so everything they show has to
       be here, with absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GenUI Clinic">
  <meta property="og:title" content="GenUI Clinic">
  <meta property="og:description" content="A patient dashboard composed by AI around each complaint. Demo by Solid Software with fictional patients.">
  <meta property="og:url" content="https://genui-clinic.solid.software/">
  <meta property="og:image" content="https://genui-clinic.solid.software/og-image.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Solid Software: GenUI Clinic, an AI-composed patient dashboard with charts, labs and an X-ray.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GenUI Clinic">
  <meta name="twitter:description" content="A patient dashboard composed by AI around each complaint. Demo by Solid Software with fictional patients.">
  <meta name="twitter:image" content="https://genui-clinic.solid.software/og-image.png?v=4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GenUI Clinic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon -->
  <!-- The ?v= query changes whenever the icon does: browsers cache
       favicons per site for a long time and ignore a changed file. -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>GenUI Clinic</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
